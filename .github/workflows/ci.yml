name: CI
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      # Object files from the last run. Safe to reuse: SCons decides by content (MD5), so anything whose source,
      # header or flags changed is rebuilt, and PlatformIO wipes the folder itself when files are added or removed
      # (its project checksum). Release builds use no such cache: they always build from scratch.
      - name: Cache the builds
        uses: actions/cache@v4
        with:
          path: firmware/.pio/build
          key: pio-build-${{ runner.os }}-${{ hashFiles('firmware/**', '!firmware/.cache/**') }}
          restore-keys: pio-build-${{ runner.os }}-
      - name: Install PlatformIO, SDL2 and curl
        run: |
          pip install platformio==6.2.0 -r ../tools/requirements.txt
          sudo apt-get update && sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev zlib1g-dev
      # Before any pio run, so PlatformIO's project checksum (it lists src/ headers) stays the same and no
      # later pio command wipes .pio/build.
      - name: Generate the web page header
        run: python scripts/web_embed.py
      - name: Native tests
        run: pio test -e test
      - name: Upload golden differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actuals
          path: firmware/test/golden/*.actual.ppm
          if-no-files-found: ignore
      - name: Tool self-tests
        run: |
          python -I ../tools/build_map.py --selftest
          python -I ../tools/build_pack.py --selftest
      - name: Build every environment
        run: |
          for e in cyd2usb cyd2usb_editorial cyd2usb_soak cyd_microusb ws28 sim cyd_sdload ws28_sdload cyd_probe cyd_bench cyd_touch; do
            pio run -e "$e"
          done
  pack-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Month and sources
        id: month
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "sources=$(python -I -c 'import hashlib, json, sys; sys.path.insert(0, "tools"); import build_map; print(hashlib.sha256(json.dumps(build_map.SOURCES, sort_keys=True).encode()).hexdigest()[:12])')" >> "$GITHUB_OUTPUT"
      - name: Cache the map sources
        uses: actions/cache@v4
        with:
          path: tools/.cache/map
          key: map-sources-${{ steps.month.outputs.month }}-${{ steps.month.outputs.sources }}
      - name: Regions build the same packs as the sources
        run: python -I tools/map_regions.py --selftest
      - name: Pyodide builds the same pack
        run: |
          python -I tools/map_regions.py --out "$RUNNER_TEMP/mapdata"
          python -I tools/build_map.py --lat 39.4176 --lon -77.3743 --out "$RUNNER_TEMP/native.pak"
          npm install --prefix "$RUNNER_TEMP/node" --no-save --ignore-scripts --no-audit --no-fund pyodide@0.27.7
          node tools/sd_node_test.mjs "$RUNNER_TEMP/node/node_modules/pyodide/pyodide.mjs" "$RUNNER_TEMP/mapdata" "$RUNNER_TEMP/native.pak"
  # The browser simulator (6b): the WebAssembly build must draw the same pixels as the desktop one.
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO, SDL2 and curl
        run: |
          pip install platformio==6.2.0 -r tools/requirements.txt
          sudo apt-get update && sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache
      - name: Desktop simulator
        working-directory: firmware
        run: pio run -e sim
      - name: WebAssembly build
        run: tools/build_wasm.sh "$RUNNER_TEMP/sim"
      - name: The browser build draws the same pixels
        run: node tools/sim_node_test.mjs "$RUNNER_TEMP/sim" firmware/.pio/build/sim/program
      - name: Recorder self-test
        run: python -I tools/record_sky.py --selftest
