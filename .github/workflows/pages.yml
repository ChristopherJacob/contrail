name: Pages
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
  # The simulator's recordings (6b): an hour old at most.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

# A deploy in progress finishes; the next run waits for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build_wasm.sh's git describe needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO, SDL2 and curl
        run: |
          pip install platformio==6.2.0 -r tools/requirements.txt
          sudo apt-get update && sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache
      - name: Simulator
        working-directory: firmware
        run: pio run -e sim
      - name: Screenshots
        run: tools/screenshots.sh firmware/.pio/build/sim/program site/shots
      # The map sources (about 106 MB) are kept a month: OurAirports and GeoNames change daily, Natural Earth is
      # pinned. A new month or a changed SOURCES table downloads them again.
      - name: Month and sources
        id: month
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "sources=$(python -I -c 'import hashlib, json, sys; sys.path.insert(0, "tools"); import build_map; print(hashlib.sha256(json.dumps(build_map.SOURCES, sort_keys=True).encode()).hexdigest()[:12])')" >> "$GITHUB_OUTPUT"
      - name: Cache the map sources
        uses: actions/cache@v4
        with:
          path: tools/.cache/map
          key: map-sources-${{ steps.month.outputs.month }}-${{ steps.month.outputs.sources }}
      - name: SD card page data
        run: tools/sd_site.sh site
      # GitHub's release downloads allow no cross-origin reads, so ESP Web Tools can't fetch them from the page:
      # the latest release's install images and logos.pak are served from the site itself (see site/install.js).
      - name: Latest release's install images and logos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/firmware
          # Only "no release" (HTTP 404) gives the page without the Install button; any other failure fails the job.
          if body="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2>api.err)"; then
            tag="$(jq -r .tag_name <<<"$body")"
            [ -n "$tag" ] && [ "$tag" != null ] || { echo "latest release has no tag_name" >&2; exit 1; }
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir site/firmware \
              --pattern contrail-cyd2usb-install.bin --pattern contrail-cyd_microusb-install.bin --pattern logos.pak
            ls site/firmware/contrail-cyd2usb-install.bin site/firmware/contrail-cyd_microusb-install.bin
            [ -f site/firmware/logos.pak ] || echo "release has no logos.pak; the SD card page builds the map alone"
            sed -i "s/\"version\": \"latest\"/\"version\": \"${tag#v}\"/" site/manifest-*.json
            printf '{"tag": "%s"}\n' "$tag" > site/firmware/release.json
          elif grep -q '(HTTP 404)' api.err; then
            echo "No release yet"
            printf '{"tag": null}\n' > site/firmware/release.json
          else
            cat api.err >&2
            exit 1
          fi
          rm -f api.err
          ls -l site site/shots site/firmware site/py && du -sh site/mapdata
      # About 10 minutes: 30 replies 20 s apart for each place, at once, then their routes. A failed place is left
      # out; with none recorded, the page says so and the rest of the site still deploys. The timeout is for a hung
      # adsbdb, which would otherwise run the job past its 30 minutes and block that hour's deploy; a killed run
      # leaves only <id>.tmp folders, which sim_site.py ignores.
      - name: Record the simulator's flights
        run: timeout 15m python -I tools/record_sky.py tools/sim_places.json "$RUNNER_TEMP/recordings" || echo "no recordings"
      - name: Simulator site files
        run: python -I tools/sim_site.py site "$RUNNER_TEMP/recordings"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
