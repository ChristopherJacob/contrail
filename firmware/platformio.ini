; Contrail — flights overhead on a Cheap Yellow Display.
; Envs: cyd2usb / cyd2usb_editorial / cyd_microusb / ws28 (hardware), sim (SDL desktop), test (native unit tests),
; cyd_probe / cyd_bench / cyd_touch (hardware diagnostics), cyd_sdload / ws28_sdload (SD loader).

[platformio]
default_envs = cyd2usb

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wno-unused-function

[esp32_base]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
lib_ignore = hal_native, hal_wasm
build_src_filter = +<main_esp32.cpp> +<web/>
extra_scripts =
    pre:scripts/web_embed.py
    post:scripts/version.py
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=1 -DCONTRAIL_ESP32 -fno-math-errno

[env:cyd2usb]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DCONTRAIL_BOARD_CYD2USB

; 30-minute hardware soak: cycles every screen every 20 s, switching theme after every full cycle.
[env:cyd2usb_soak]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DCONTRAIL_BOARD_CYD2USB -DCONTRAIL_SOAK_CAROUSEL=20 -DCONTRAIL_SOAK_THEMES

; Bold Editorial on the board (the theme setting has no on-device UI yet).
[env:cyd2usb_editorial]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DCONTRAIL_BOARD_CYD2USB -DCONTRAIL_FORCE_THEME=\"editorial\"

[env:cyd_microusb]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DCONTRAIL_BOARD_CYD_MICROUSB

; Waveshare ESP32-S3-Touch-LCD-2.8: ESP32-S3, 16 MB flash, 8 MB octal PSRAM, native USB (the serial port is the
; chip's own USB, so Serial is USB CDC).
[ws28_base]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed = 921600
build_flags = ${esp32_base.build_flags} -DCONTRAIL_BOARD_WS28 -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:ws28]
extends = ws28_base

[env:ws28_sdload]
extends = ws28_base
build_src_filter = +<main_sdload.cpp>
build_flags = ${ws28_base.build_flags} -DSDLOAD_BAUD=460800
lib_ldf_mode = deep+

[env:sim]
platform = native
lib_deps = bblanchon/ArduinoJson@^7.2.0
lib_ignore = hal_esp32, hal_wasm
build_src_filter = +<main_sim.cpp>
extra_scripts = post:scripts/version.py
build_flags =
    ${env.build_flags}
    -DCONTRAIL_SIM
    -ffp-contract=off
    !sdl2-config --cflags
    !sdl2-config --libs
    -lcurl -lpthread

[env:test]
platform = native
lib_deps = bblanchon/ArduinoJson@^7.2.0
lib_ignore = hal_esp32, hal_native, hal_wasm
test_build_src = no
; -ffp-contract=off (here and in sim): no fused multiply-add, so the goldens are the same on every host.
; clang on Apple arm64 contracts a*b+c into one FMA by default, x86-64 Linux (CI) does not, which moved
; map trail pixels.
build_flags =
    ${env.build_flags}
    -DCONTRAIL_TEST
    -ffp-contract=off
    -DUNITY_INCLUDE_DOUBLE
    -I test/common
    -DFIXTURE_DIR=\"${PROJECT_DIR}/test/fixtures\"
    -DGOLDEN_DIR=\"${PROJECT_DIR}/test/golden\"
    -lz

; Display probe: cycles panel driver / inversion options to identify an unknown CYD panel.
[env:cyd_probe]
extends = esp32_base
build_src_filter = +<main_probe.cpp>
; Probes only include hal_esp32, so LDF needs deep+ to find core's dependencies.
lib_ldf_mode = deep+

; Renderer micro-benchmark: times drawing primitives on the device.
[env:cyd_bench]
extends = esp32_base
build_src_filter = +<main_bench.cpp>

; Touch probe: draws a dot under the finger to check the touch axes.
[env:cyd_touch]
extends = esp32_base
build_src_filter = +<main_touch.cpp>
build_flags = ${esp32_base.build_flags} -DCONTRAIL_BOARD_CYD2USB
lib_ldf_mode = deep+

; SD loader: writes files to the microSD card over USB serial (host side: tools/sd_upload.py).
[env:cyd_sdload]
extends = esp32_base
build_src_filter = +<main_sdload.cpp>
; 921600 garbled the output on this board (its USB-serial bridge, on macOS); 460800 is reliable.
build_flags = ${esp32_base.build_flags} -DSDLOAD_BAUD=460800
lib_ldf_mode = deep+
